<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#11252b">
    <meta http-equiv="refresh" content="20;url=/">
    <title>Distribuidora Lopez - Mantenimiento</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f4f6f5;
        color: #172126;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background: #f4f6f5;
      }

      .maintenance-shell {
        min-height: 100vh;
        display: grid;
        grid-template-rows: 10px 1fr auto;
      }

      .brand-line {
        background: linear-gradient(90deg, #c91517 0 42%, #f2c94c 42% 58%, #0d7068 58% 100%);
      }

      main {
        width: min(920px, calc(100% - 40px));
        margin: auto;
        display: grid;
        grid-template-columns: minmax(180px, 300px) minmax(0, 1fr);
        align-items: center;
        gap: clamp(32px, 7vw, 76px);
        padding: 48px 0 36px;
      }

      .logo-wrap {
        display: grid;
        place-items: center;
      }

      .logo-wrap img {
        display: block;
        width: min(100%, 280px);
        height: auto;
        border: 1px solid #d7ddda;
        border-radius: 8px;
        box-shadow: 0 18px 48px rgba(17, 37, 43, 0.12);
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin: 0 0 20px;
        color: #0b625b;
        font-size: 0.82rem;
        font-weight: 800;
        text-transform: uppercase;
      }

      .status-dot {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: #e2aa13;
        box-shadow: 0 0 0 5px rgba(226, 170, 19, 0.16);
        animation: pulse 1.8s ease-in-out infinite;
      }

      h1 {
        max-width: 620px;
        margin: 0;
        color: #11252b;
        font-size: clamp(2.35rem, 7vw, 4.7rem);
        line-height: 1.02;
        letter-spacing: 0;
      }

      .message {
        max-width: 590px;
        margin: 24px 0 0;
        color: #3b4b51;
        font-size: clamp(1.05rem, 2.2vw, 1.35rem);
        line-height: 1.6;
      }

      .return-note {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 30px 0 0;
        padding-top: 22px;
        border-top: 1px solid #d5dcda;
        color: #59676c;
        font-size: 0.95rem;
        line-height: 1.45;
      }

      .return-note svg {
        flex: 0 0 auto;
        width: 22px;
        height: 22px;
        color: #0d7068;
      }

      footer {
        padding: 22px 24px 26px;
        color: #6a767a;
        font-size: 0.82rem;
        text-align: center;
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.58; transform: scale(0.85); }
      }

      @media (prefers-reduced-motion: reduce) {
        .status-dot { animation: none; }
      }

      @media (max-width: 680px) {
        main {
          width: min(100% - 32px, 520px);
          grid-template-columns: 1fr;
          gap: 30px;
          padding: 36px 0 24px;
          text-align: center;
        }

        .logo-wrap img {
          width: 170px;
        }

        .status,
        .return-note {
          justify-content: center;
        }

        .message {
          margin-right: auto;
          margin-left: auto;
        }
      }
    </style>
  </head>
  <body>
    <div class="maintenance-shell">
      <div class="brand-line" aria-hidden="true"></div>
      <main>
        <div class="logo-wrap">
          <img src="/icons/logo-distribuidora-lopez-512.png" alt="Distribuidora Lopez">
        </div>
        <section aria-labelledby="maintenanceTitle">
          <p class="status"><span class="status-dot" aria-hidden="true"></span>Estamos trabajando</p>
          <h1 id="maintenanceTitle">Volvemos en unos minutos</h1>
          <p class="message">Estamos acomodando cada detalle con cari&ntilde;o para volver mejor y seguir llegando juntos mas lejos.</p>
          <p class="return-note">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 11a8.1 8.1 0 0 0-15.5-2M4 4v5h5"></path>
              <path d="M4 13a8.1 8.1 0 0 0 15.5 2M20 20v-5h-5"></path>
            </svg>
            Esta pantalla se actualiza automaticamente cuando el servicio vuelve a estar disponible.
          </p>
        </section>
      </main>
      <footer>Distribuidora Lopez</footer>
    </div>
  </body>
</html>
